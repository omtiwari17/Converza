{% extends 'base.html' %}

{% block content %}
<section class="card bg-base-100 converza-card rounded-2xl p-4 sm:p-5">
  <form id="upload-form"
        hx-post="/upload"
        hx-target="#files"
        hx-swap="beforeend"
        hx-encoding="multipart/form-data"
        hx-trigger="change from:#picker"
        hx-indicator="#upload-status">
    <input id="picker" type="file" name="files" multiple class="sr-only">
    <label id="dropzone"
           for="picker"
           class="flex min-h-[124px] w-full cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border border-dashed border-base-content/20 bg-base-200/60 px-4 py-6 text-center hover:border-primary/60 hover:bg-base-200 focus-within:ring-2 focus-within:ring-primary/60">
      <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-base-100 converza-card text-primary" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" x2="12" y1="3" y2="15"/>
        </svg>
      </span>
      <span class="text-sm font-medium">Tap to choose files or drop here</span>
      <span class="font-mono text-[11px] uppercase tracking-wider opacity-65 tabular-nums">
        Max {{ max_upload_mb }} MB · Video · Audio · Image · Document · PDF
      </span>
    </label>
    <div id="upload-status" class="htmx-indicator mt-3 flex items-center gap-2 text-xs opacity-75">
      <progress class="progress progress-primary h-1.5 w-24" aria-label="Uploading files"></progress>
      <span>Uploading files...</span>
    </div>
  </form>
</section>

<div id="live-status" class="sr-only" role="status" aria-live="polite"></div>

<section id="bulk-bar" class="hidden card bg-base-100 converza-card rounded-xl p-3">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <span id="bulk-summary" class="font-mono text-xs uppercase tracking-wider opacity-75 tabular-nums">0 files</span>
    <div class="flex flex-wrap items-center gap-2">
      <button id="convert-all-btn"
              type="button"
              class="btn btn-primary btn-sm min-h-[44px] px-4">
        Convert all
      </button>
      <a id="download-zip-btn"
         href="#"
         class="btn btn-outline btn-sm min-h-[44px] px-4 btn-disabled"
         aria-disabled="true">
        Download all (ZIP)
      </a>
    </div>
  </div>
</section>

<section id="files" class="space-y-3" aria-label="Uploaded files"></section>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    var picker = document.getElementById('picker');
    var dropzone = document.getElementById('dropzone');
    var filesEl = document.getElementById('files');
    var bulkBar = document.getElementById('bulk-bar');
    var bulkSummary = document.getElementById('bulk-summary');
    var convertAllBtn = document.getElementById('convert-all-btn');
    var downloadZipBtn = document.getElementById('download-zip-btn');
    var liveStatus = document.getElementById('live-status');

    if (dropzone && picker) {
      ['dragenter', 'dragover'].forEach(function (evName) {
        dropzone.addEventListener(evName, function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          dropzone.classList.add('border-primary', 'bg-base-200');
        });
      });

      ['dragleave', 'drop'].forEach(function (evName) {
        dropzone.addEventListener(evName, function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          dropzone.classList.remove('border-primary', 'bg-base-200');
        });
      });

      dropzone.addEventListener('drop', function (ev) {
        var dropped = ev.dataTransfer && ev.dataTransfer.files;
        if (!dropped || !dropped.length) return;
        try {
          var dt = new DataTransfer();
          for (var i = 0; i < dropped.length; i++) dt.items.add(dropped[i]);
          picker.files = dt.files;
        } catch (e) {
          picker.files = dropped;
        }
        picker.dispatchEvent(new Event('change', { bubbles: true }));
      });
    }

    function syncBulkBar() {
      if (!filesEl || !bulkBar) return;
      var rows = filesEl.querySelectorAll('[data-job-id]');
      var total = rows.length;
      if (total < 2) {
        bulkBar.classList.add('hidden');
        return;
      }
      bulkBar.classList.remove('hidden');
      var doneIds = [];
      var actionable = 0;
      rows.forEach(function (row) {
        var st = row.getAttribute('data-job-status');
        if (st === 'done') doneIds.push(row.getAttribute('data-job-id'));
        if (st === 'uploaded' || st === 'error') actionable++;
      });
      if (bulkSummary) {
        bulkSummary.textContent = total + ' files · ' + doneIds.length + ' ready';
      }
      if (convertAllBtn) {
        convertAllBtn.disabled = actionable === 0;
      }
      if (downloadZipBtn) {
        if (doneIds.length >= 1) {
          downloadZipBtn.classList.remove('btn-disabled');
          downloadZipBtn.removeAttribute('aria-disabled');
          downloadZipBtn.href = '/zip?ids=' + encodeURIComponent(doneIds.join(','));
        } else {
          downloadZipBtn.classList.add('btn-disabled');
          downloadZipBtn.setAttribute('aria-disabled', 'true');
          downloadZipBtn.href = '#';
        }
      }
    }

    if (convertAllBtn && filesEl) {
      convertAllBtn.addEventListener('click', function () {
        var forms = filesEl.querySelectorAll('form[data-convert-form]');
        forms.forEach(function (form) {
          if (typeof form.requestSubmit === 'function') {
            form.requestSubmit();
          } else {
            htmx.trigger(form, 'submit');
          }
        });
      });
    }

    document.body.addEventListener('htmx:afterRequest', function (ev) {
      if (ev.detail && ev.detail.elt && ev.detail.elt.id === 'upload-form' && picker) {
        picker.value = '';
      }
    });

    document.body.addEventListener('htmx:afterSettle', function (ev) {
      syncBulkBar();
      var target = ev.detail && ev.detail.target;
      if (target && target.getAttribute && target.getAttribute('data-job-status') === 'done' && liveStatus) {
        var nameEl = target.querySelector('[data-job-name]');
        liveStatus.textContent = (nameEl ? nameEl.textContent : 'File') + ' conversion complete.';
      }
    });
  })();
</script>
{% endblock %}
