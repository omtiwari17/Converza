{% macro icon(name, size=20, extra_class='') -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 {{ extra_class }}" aria-hidden="true">
  {%- if name == 'upload' -%}
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>
  {%- elif name == 'plus' -%}
  <path d="M5 12h14"/><path d="M12 5v14"/>
  {%- elif name == 'x' -%}
  <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
  {%- elif name == 'film' -%}
  <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/>
  {%- elif name == 'music' -%}
  <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
  {%- elif name == 'image' -%}
  <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
  {%- elif name == 'file-text' -%}
  <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>
  {%- elif name == 'file' -%}
  <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>
  {%- elif name == 'check-circle' -%}
  <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
  {%- elif name == 'alert-circle' -%}
  <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
  {%- elif name == 'download' -%}
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
  {%- elif name == 'chevron-down' -%}
  <path d="m6 9 6 6 6-6"/>
  {%- elif name == 'sun' -%}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
  {%- elif name == 'moon' -%}
  <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
  {%- elif name == 'loader' -%}
  <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
  {%- elif name == 'info' -%}
  <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
  {%- endif -%}
</svg>
{%- endmacro %}
