<div class="mt-2 rounded-xl border border-base-300 bg-base-100 p-3">
  <div class="mb-2 flex items-center justify-between gap-2">
    <span class="text-[14px] font-medium text-muted">Preview</span>
    <div class="flex items-center gap-1.5">
      {% if job.preview_kind in ('image', 'html') %}
      <button type="button"
              data-enlarge-src="/jobs/{{ job.id }}/media"
              data-enlarge-kind="{{ job.preview_kind }}"
              data-enlarge-title="{{ job.name }}"
              data-enlarge-download="/download/{{ job.id }}"
              class="btn btn-outline btn-xs min-h-[32px] border-base-300 px-2.5 text-xs font-medium">
        Enlarge
      </button>
      {% endif %}
      <button type="button"
              data-close-preview="preview-{{ job.id }}"
              aria-label="Close preview for {{ job.name }}"
              class="btn btn-ghost btn-xs min-h-[32px] px-2 text-xs">
        Close
      </button>
    </div>
  </div>

  {% if job.preview_kind == 'image' %}
  <button type="button"
          data-enlarge-src="/jobs/{{ job.id }}/media"
          data-enlarge-kind="image"
          data-enlarge-title="{{ job.name }}"
          data-enlarge-download="/download/{{ job.id }}"
          aria-label="Enlarge preview of {{ job.name }}"
          class="flex max-h-96 w-full cursor-zoom-in items-center justify-center overflow-hidden rounded-lg bg-base-200 p-2">
    <img src="/jobs/{{ job.id }}/media"
         alt="Converted preview of {{ job.name }}"
         loading="lazy"
         class="max-h-88 w-auto rounded object-contain">
  </button>
  {% elif job.preview_kind == 'audio' %}
  <audio controls preload="metadata" class="w-full">
    <source src="/jobs/{{ job.id }}/media">
    Your browser does not support audio playback.
  </audio>
  {% elif job.preview_kind == 'video' %}
  <video controls preload="metadata" class="max-h-96 w-full rounded-lg bg-black">
    <source src="/jobs/{{ job.id }}/media">
    Your browser does not support video playback.
  </video>
  {% elif job.preview_kind == 'html' %}
  <iframe sandbox=""
          src="/jobs/{{ job.id }}/media"
          title="HTML preview of {{ job.name }}"
          class="h-80 w-full rounded-lg border border-base-300 bg-white"></iframe>
  {% endif %}
</div>
