<div class="mt-3 rounded-xl border border-base-content/10 bg-base-200/60 p-3">
  {% if job.preview_kind == 'image' %}
  <div class="flex max-h-80 items-center justify-center overflow-hidden rounded-lg bg-base-100 p-2">
    <img src="/jobs/{{ job.id }}/media"
         alt="Converted preview of {{ job.name }}"
         loading="lazy"
         class="max-h-72 w-auto rounded object-contain">
  </div>
  {% elif job.preview_kind == 'audio' %}
  <audio controls preload="metadata" class="w-full">
    <source src="/jobs/{{ job.id }}/media">
    Your browser does not support audio playback.
  </audio>
  {% elif job.preview_kind == 'video' %}
  <video controls preload="metadata" class="max-h-80 w-full rounded-lg bg-black">
    <source src="/jobs/{{ job.id }}/media">
    Your browser does not support video playback.
  </video>
  {% elif job.preview_kind == 'html' %}
  <iframe sandbox=""
          src="/jobs/{{ job.id }}/media"
          title="HTML preview of {{ job.name }}"
          class="h-72 w-full rounded-lg border border-base-content/10 bg-white"></iframe>
  {% endif %}
</div>
