<div class="mt-3 rounded-xl border border-base-content/10 bg-base-200/60 p-3">
  <div class="mb-2 flex items-center justify-between gap-2">
    <span class="text-xs font-medium opacity-75">Preview</span>
    <div class="flex items-center gap-1.5">
      {% if job.preview_kind in ('image', 'html') %}
      <button type="button"
              data-enlarge-src="/jobs/{{ job.id }}/media"
              data-enlarge-kind="{{ job.preview_kind }}"
              data-enlarge-title="{{ job.name }}"
              data-enlarge-download="/download/{{ job.id }}"
              class="btn btn-ghost btn-xs min-h-[32px] gap-1.5 rounded-md border border-base-content/15 px-2.5 text-xs font-medium">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/>
        </svg>
        <span>Enlarge</span>
      </button>
      {% endif %}
      <button type="button"
              data-close-preview="preview-{{ job.id }}"
              aria-label="Close preview for {{ job.name }}"
              class="btn btn-ghost btn-xs min-h-[32px] rounded-md px-2 text-xs opacity-70 hover:opacity-100">
        Close
      </button>
    </div>
  </div>

  {% if job.preview_kind == 'image' %}
  <button type="button"
          data-enlarge-src="/jobs/{{ job.id }}/media"
          data-enlarge-kind="image"
          data-enlarge-title="{{ job.name }}"
          data-enlarge-download="/download/{{ job.id }}"
          aria-label="Enlarge preview of {{ job.name }}"
          class="flex max-h-96 w-full cursor-zoom-in items-center justify-center overflow-hidden rounded-lg bg-base-100 p-2">
    <img src="/jobs/{{ job.id }}/media"
         alt="Converted preview of {{ job.name }}"
         loading="lazy"
         class="max-h-88 w-auto rounded object-contain">
  </button>
  {% elif job.preview_kind == 'audio' %}
  <audio controls preload="metadata" class="w-full">
    <source src="/jobs/{{ job.id }}/media">
    Your browser does not support audio playback.
  </audio>
  {% elif job.preview_kind == 'video' %}
  <video controls preload="metadata" class="max-h-96 w-full rounded-lg bg-black">
    <source src="/jobs/{{ job.id }}/media">
    Your browser does not support video playback.
  </video>
  {% elif job.preview_kind == 'html' %}
  <iframe sandbox=""
          src="/jobs/{{ job.id }}/media"
          title="HTML preview of {{ job.name }}"
          class="h-80 w-full rounded-lg border border-base-content/10 bg-white"></iframe>
  {% endif %}
</div>
