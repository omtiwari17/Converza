<div class="mt-3 rounded-xl border border-base-content/10 bg-base-200/60 p-3">
  <div class="mb-2.5 flex items-center justify-between gap-2">
    <span class="text-xs font-medium opacity-80">
      {{ job.page_count }} pages — tap any page to enlarge or download
    </span>
    <button type="button"
            data-close-preview="preview-{{ job.id }}"
            aria-label="Close pages for {{ job.name }}"
            class="btn btn-ghost btn-xs min-h-[32px] rounded-md px-2 text-xs opacity-70 hover:opacity-100">
      Close
    </button>
  </div>
  <div class="grid max-h-96 grid-cols-2 gap-2.5 overflow-y-auto sm:grid-cols-3 md:grid-cols-4">
    {% for page_name in job.pages %}
    <div class="flex flex-col justify-between gap-2 rounded-lg border border-base-content/10 bg-base-100 p-2">
      <button type="button"
              data-enlarge-src="/download/{{ job.id }}/page/{{ loop.index }}?inline=1"
              data-enlarge-kind="image"
              data-enlarge-title="{{ job.name }} — Page {{ loop.index }}"
              data-enlarge-download="/download/{{ job.id }}/page/{{ loop.index }}"
              aria-label="Enlarge page {{ loop.index }} of {{ job.name }}"
              class="flex aspect-[3/4] w-full cursor-zoom-in items-center justify-center overflow-hidden rounded-md bg-base-200/70">
        <img src="/download/{{ job.id }}/page/{{ loop.index }}?inline=1"
             alt="Page {{ loop.index }} of {{ job.name }}"
             loading="lazy"
             class="h-full w-full object-contain">
      </button>
      <a href="/download/{{ job.id }}/page/{{ loop.index }}"
         download
         class="btn btn-outline btn-xs min-h-[34px] w-full gap-1 text-xs font-medium converza-interactive">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" x2="12" y1="15" y2="3"/>
        </svg>
        <span>Page {{ loop.index }}</span>
      </a>
    </div>
    {% endfor %}
  </div>
</div>
