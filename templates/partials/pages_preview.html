<div class="mt-2 rounded-xl border border-base-300 bg-base-100 p-3">
  <div class="mb-2.5 flex items-center justify-between gap-2">
    <span class="text-[14px] font-medium text-muted">
      {{ job.page_count }} pages — tap any page to enlarge
    </span>
    <button type="button"
            data-close-preview="preview-{{ job.id }}"
            aria-label="Close pages for {{ job.name }}"
            class="btn btn-ghost btn-xs min-h-[32px] px-2 text-xs">
      Close
    </button>
  </div>
  <div class="grid max-h-96 grid-cols-2 gap-2.5 overflow-y-auto sm:grid-cols-3">
    {% for page_name in job.pages %}
    <div class="flex flex-col justify-between gap-2 rounded-xl border border-base-300 bg-base-200 p-2">
      <button type="button"
              data-enlarge-src="/download/{{ job.id }}/page/{{ loop.index }}?inline=1"
              data-enlarge-kind="image"
              data-enlarge-title="{{ job.name }} — Page {{ loop.index }}"
              data-enlarge-download="/download/{{ job.id }}/page/{{ loop.index }}"
              aria-label="Enlarge page {{ loop.index }} of {{ job.name }}"
              class="flex aspect-[3/4] w-full cursor-zoom-in items-center justify-center overflow-hidden rounded-lg bg-base-100">
        <img src="/download/{{ job.id }}/page/{{ loop.index }}?inline=1"
             alt="Page {{ loop.index }} of {{ job.name }}"
             loading="lazy"
             class="h-full w-full object-contain">
      </button>
      <a href="/download/{{ job.id }}/page/{{ loop.index }}"
         download
         class="btn btn-outline btn-xs min-h-[36px] w-full border-base-300 text-xs font-medium">
        Page {{ loop.index }}
      </a>
    </div>
    {% endfor %}
  </div>
</div>
