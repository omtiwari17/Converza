<div class="mt-3 rounded-xl border border-base-content/10 bg-base-200/60 p-3">
  <div class="mb-2.5 flex items-center justify-between gap-2">
    <span class="text-xs font-medium opacity-80">
      {{ job.page_count }} pages — download individually or use the ZIP above
    </span>
  </div>
  <div class="grid max-h-80 grid-cols-2 gap-2.5 overflow-y-auto sm:grid-cols-3 md:grid-cols-4">
    {% for page_name in job.pages %}
    <div class="flex flex-col justify-between gap-2 rounded-lg border border-base-content/10 bg-base-100 p-2">
      <div class="flex aspect-[3/4] items-center justify-center overflow-hidden rounded-md bg-base-200/70">
        <img src="/download/{{ job.id }}/page/{{ loop.index }}?inline=1"
             alt="Page {{ loop.index }} of {{ job.name }}"
             loading="lazy"
             class="h-full w-full object-contain">
      </div>
      <a href="/download/{{ job.id }}/page/{{ loop.index }}"
         download
         class="btn btn-outline btn-xs min-h-[34px] w-full gap-1 text-xs font-medium converza-interactive">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" x2="12" y1="15" y2="3"/>
        </svg>
        <span>Page {{ loop.index }}</span>
      </a>
    </div>
    {% endfor %}
  </div>
</div>
