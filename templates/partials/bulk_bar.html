{% from '_icons.html' import icon -%}
<div id="bulk-bar"
     {% if oob %}hx-swap-oob="true"{% endif %}
     class="{% if not bulk.visible %}hidden{% endif %} fixed inset-x-0 bottom-0 z-30 border-t border-base-300 bg-base-100 px-4 py-3"
     style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 0px));">
  <div class="mx-auto max-w-[640px]">
    {% if bulk.active_count > 0 %}
    <button type="button" disabled class="btn h-12 min-h-[48px] w-full gap-2 rounded-xl text-[16px] font-medium">
      {{ icon('loader', 20, 'motion-safe:animate-spin') }}
      <span>Converting {{ bulk.converting_index }} of {{ bulk.total }}...</span>
    </button>
    {% elif bulk.all_done %}
    <a href="/zip?ids={{ bulk.done_ids | join(',') }}"
       class="btn btn-primary h-12 min-h-[48px] w-full gap-2 rounded-xl text-[16px] font-medium">
      {{ icon('download', 20) }}
      <span>Download all (ZIP)</span>
    </a>
    {% elif bulk.ready_count > 0 %}
    <button id="convert-all-btn"
            type="button"
            class="btn btn-primary h-12 min-h-[48px] w-full rounded-xl text-[16px] font-medium">
      Convert all ({{ bulk.ready_count }})
    </button>
    {% elif bulk.done_count >= 2 %}
    <a href="/zip?ids={{ bulk.done_ids | join(',') }}"
       class="btn btn-primary h-12 min-h-[48px] w-full gap-2 rounded-xl text-[16px] font-medium">
      {{ icon('download', 20) }}
      <span>Download all (ZIP)</span>
    </a>
    {% endif %}
  </div>
</div>
