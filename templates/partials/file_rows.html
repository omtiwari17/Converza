{% if skipped %}
<div class="alert converza-alert-warn rounded-xl text-sm" role="alert" data-skipped-notice>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" aria-hidden="true">
    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
    <path d="M12 9v4"/>
    <path d="M12 17h.01"/>
  </svg>
  <span class="break-words">Skipped unsupported or unavailable files: {{ skipped | join(', ') }}</span>
</div>
{% endif %}
{% if empty %}
<div class="alert rounded-xl converza-card bg-base-100 text-sm" role="status">
  <span>No files selected.</span>
</div>
{% endif %}
{% for job in rows %}
  {% include 'partials/job_row.html' %}
{% endfor %}
