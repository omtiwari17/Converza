<div class="mt-3 rounded-lg border border-base-content/10 bg-base-200/70 p-3">
  <div class="mb-2 flex items-center justify-between gap-2">
    <span class="font-mono text-[11px] uppercase tracking-wider opacity-70">
      Extracted text{% if truncated %} (first 64 KB){% endif %}
    </span>
    <span class="relative inline-flex items-center gap-2">
      <button type="button"
              class="copy-button btn btn-ghost btn-xs min-h-[32px] gap-1.5 rounded-md border border-base-content/15 px-2.5"
              command="--copy"
              commandfor="text-{{ job.id }}"
              aria-label="Copy extracted text for {{ job.name }}">
        <svg class="copy-icon-default" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </svg>
        <svg class="copy-icon-done" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Copy</span>
      </button>
      <span class="copy-tip font-mono text-[11px] text-primary" role="status"></span>
    </span>
  </div>
  <pre tabindex="0"
       role="region"
       aria-label="Text preview for {{ job.name }}"
       class="max-h-48 overflow-auto whitespace-pre-wrap break-words rounded-md bg-base-100 p-2.5 font-mono text-xs leading-relaxed"><code id="text-{{ job.id }}">{{ text }}</code></pre>
</div>
